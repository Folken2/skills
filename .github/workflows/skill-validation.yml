name: Skill validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skills/index.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('skills/index.json'))"
          echo "index.json is valid JSON"

      - name: Validate index.json entry structure
        run: |
          python3 - <<'PY'
          import json, sys

          data = json.load(open("skills/index.json"))
          themes = data.get("themes")
          if not isinstance(themes, dict):
              print("FAIL: index.json 'themes' must be an object")
              sys.exit(1)

          errors = []
          required_str = ("name", "description", "author", "theme")
          for theme, entries in themes.items():
              if not isinstance(entries, list):
                  errors.append(f"theme '{theme}' must map to a list")
                  continue
              for i, entry in enumerate(entries):
                  where = f"themes.{theme}[{i}]"
                  if not isinstance(entry, dict):
                      errors.append(f"{where}: entry must be an object")
                      continue
                  for field in required_str:
                      if field not in entry:
                          errors.append(f"{where}: missing required field '{field}'")
                      elif not isinstance(entry[field], str) or not entry[field].strip():
                          errors.append(f"{where}: field '{field}' must be a non-empty string")
                  if "theme" in entry and isinstance(entry["theme"], str) and entry["theme"] != theme:
                      errors.append(f"{where}: 'theme' value '{entry['theme']}' does not match its bucket '{theme}'")
                  if "dependency" in entry and not isinstance(entry["dependency"], bool):
                      errors.append(f"{where}: optional field 'dependency' must be a boolean")

          if errors:
              print("FAIL: index.json structure errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("index.json entry structure OK")
          PY

      - name: Validate every skill directory has a SKILL.md
        run: |
          python3 - <<'PY'
          import os, sys

          root = "skills"
          errors = []
          for theme in sorted(os.listdir(root)):
              theme_path = os.path.join(root, theme)
              if not os.path.isdir(theme_path):
                  continue
              for name in sorted(os.listdir(theme_path)):
                  skill_dir = os.path.join(theme_path, name)
                  if not os.path.isdir(skill_dir):
                      continue
                  if not os.path.isfile(os.path.join(skill_dir, "SKILL.md")):
                      errors.append(f"{skill_dir} has no SKILL.md")

          if errors:
              print("FAIL: skill directories missing SKILL.md:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("Every skill directory has a SKILL.md")
          PY

      - name: Install pyyaml for frontmatter validation
        run: pip install pyyaml --quiet

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          errors = []
          warnings = []
          for path in sorted(glob.glob("skills/**/SKILL.md", recursive=True)):
              with open(path, encoding="utf-8") as fh:
                  text = fh.read()
              if not text.startswith("---"):
                  errors.append(f"{path}: missing or malformed YAML frontmatter")
                  continue
              parts = text.split("---", 2)
              if len(parts) < 3 or not parts[2].strip():
                  errors.append(f"{path}: frontmatter missing closing --- or empty body")
                  continue
              try:
                  fm = yaml.safe_load(parts[1])
              except Exception as e:
                  errors.append(f"{path}: YAML parse error — {e}")
                  continue
              if not isinstance(fm, dict):
                  errors.append(f"{path}: frontmatter is not a YAML mapping")
                  continue
              for field in ("name", "description"):
                  if not fm.get(field):
                      errors.append(f"{path}: frontmatter missing required field '{field}'")
              if not fm.get("version"):
                  warnings.append(f"{path}: frontmatter missing recommended field 'version'")
              if not fm.get("author"):
                  warnings.append(f"{path}: frontmatter missing recommended field 'author'")

          if warnings:
              print("::warning::SKILL.md files missing recommended fields:")
              for w in warnings:
                  print(f"  - {w}")

          if errors:
              print("FAIL: SKILL.md frontmatter errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("Every SKILL.md has valid frontmatter (name, description)")
          PY

      - name: Block body modifications to existing SKILL.md files
        run: |
          git fetch origin main
          MODIFIED=$(git diff origin/main --name-only --diff-filter=M -- 'skills/**/SKILL.md')
          echo "Modified SKILL.md vs origin/main:"
          echo "$MODIFIED"
          if [ -z "$MODIFIED" ]; then
            echo "No existing SKILL.md files were modified"
            exit 0
          fi
          BASE="origin/main"
          FAILED=""
          for f in $MODIFIED; do
            # Detect vendor-to-owned replacement: if old author was not Nuvel Skills and new author is Nuvel Skills
            OLD_AUTHOR=$(git show "$BASE:$f" 2>/dev/null | python3 -c "import sys,yaml; print(yaml.safe_load(sys.stdin.read().split('---')[1]).get('author',''))" 2>/dev/null || echo "")
            NEW_AUTHOR=$(python3 -c "import sys,yaml; print(yaml.safe_load(open('$f').read().split('---')[1]).get('author',''))" 2>/dev/null || echo "")
            if [ -n "$OLD_AUTHOR" ] && [ "$OLD_AUTHOR" != "Nuvel Skills" ] && [ "$NEW_AUTHOR" = "Nuvel Skills" ]; then
              echo "  [REPLACEMENT] $f — vendored skill upgraded to owned Nuvel Skills (author: '$OLD_AUTHOR' -> '$NEW_AUTHOR')"
              continue
            fi
            BASE_CLOSE=$(git show "$BASE:$f" 2>/dev/null | awk 'BEGIN{n=0} /^---$/ {n++; if(n==2){print NR; exit}}')
            PR_CLOSE=$(awk 'BEGIN{n=0} /^---$/ {n++; if(n==2){print NR; exit}}' "$f")
            if [ -z "$BASE_CLOSE" ] || [ -z "$PR_CLOSE" ]; then
              echo "  [SKIP] $f — cannot determine body boundary"
              continue
            fi
            BASE_BODY=$(git show "$BASE:$f" 2>/dev/null | tail -n +$((BASE_CLOSE + 1)))
            PR_BODY=$(tail -n +$((PR_CLOSE + 1)) "$f")
            if [ "$BASE_BODY" != "$PR_BODY" ]; then
              FAILED="$FAILED $f"
              echo "  [BLOCKED] $f — body content was modified"
            else
              echo "  [OK] $f — only frontmatter metadata changed (author/version additions)"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo ""
            echo "FAIL: existing SKILL.md body content was modified."
            echo "Only frontmatter metadata changes (author, version) or entirely new skills are allowed."
            echo "Modified files:"
            echo "$FAILED" | tr ' ' '\n' | sed '/^$/d' | sed 's/^/  - /'
            exit 1
          fi
          echo ""
          echo "All existing SKILL.md files — only frontmatter was modified. ✓"
